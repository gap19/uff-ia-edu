services:
  dashboard:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Montar dados processados (ou gerar via ETL antes do build)
      - ./data/processed:/app/data/processed:ro
    environment:
      - PYTHONUNBUFFERED=1
    mem_limit: 2g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
